<text x="35" y="151" font-size="19" fill="#4b6271">d</text>
<text x="39" y="175" font-size="17" fill="#4b6271">1</text>
<text x="48" y="374" font-size="17" fill="#4b6271">0</text>
<text x="243" y="374" font-size="17" fill="#4b6271">1</text>
<text x="427" y="374" font-size="17" fill="#4b6271">2</text>
<text x="354" y="399" font-size="18" fill="#4b6271">head radius r</text>
<text x="86" y="321" font-size="20" fill="#075f5b">inner sheet</text>
<text x="344" y="248" font-size="19" fill="#687e8b">outer sheet</text>
<text x="303" y="154" font-size="20" font-weight="700" fill="#8e5118">radial slope = 0</text>
<text x="98" y="417" font-size="20" fill="#183d4d">d(r) = 2r / (1 + r²)</text>
<text x="560" y="123" font-size="20" font-weight="700" fill="#126d68">02  AT THE FOLD</text>
<text x="560" y="159" font-size="21" fill="#102b3a">First head derivatives leave one</text>
<text x="560" y="188" font-size="21" fill="#102b3a">physical-gradient component hidden.</text>
<text x="560" y="228" font-size="21" font-weight="700" fill="#075f5b">One signed radial second derivative</text>
<text x="560" y="257" font-size="21" fill="#102b3a">completes the recovery.</text>
<rect x="551" y="286" width="419" height="132" rx="10" fill="#e7eef3"/>
<text x="570" y="315" font-size="20" font-weight="700" fill="#244e68">03  STOPPING ON THE INNER SHEET</text>
<text x="570" y="347" font-size="20" fill="#183d4d">Strong convexity, bounded intensity</text>
<text x="570" y="374" font-size="20" fill="#183d4d">and the specified derivative tests</text>
<text x="570" y="401" font-size="20" font-weight="700" fill="#183d4d">give a physical objective-gap bound.</text>
<text x="30" y="445" font-size="16" fill="#526977">Curve: fixed intensity and direction. Recovery: derivatives of the composite objective. Details and assumptions below.</text>
</g></svg>