<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">A geometric fold and a conditional stopping certificate</title>
<desc id="desc">At fixed intensity and polarization direction, the degree of linear polarization d equals 2r divided by 1 plus r squared. It reaches one at head radius r equals one, then decreases on the outer sheet. Radial first-order sensitivity vanishes at this fold. A signed radial second derivative of the composite objective completes the first-order information there. A stopping certificate on the bounded-intensity inner sheet additionally requires strong convexity and the specified derivative tests.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#697c89"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="16" fill="#f6f8fa" stroke="#dce3e8"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="46" font-size="29" font-weight="700" fill="#102b3a">A geometric fold. A conditional certificate.</text>
<text x="30" y="80" font-size="20" fill="#4b6271">Head coordinates (a, w) → physical Stokes coordinates (I, Q, U)</text>
<line x1="530" y1="108" x2="530" y2="414" stroke="#d5dfe4"/>
